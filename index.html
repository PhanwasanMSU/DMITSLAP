<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D.M.I.T SLAP WAR</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- ================================= -->
    <!-- LOBBY -->
    <!-- ================================= -->

    <section
        id="lobby"
        class="screen active"
    >

        <div class="logo">

            <div class="logo-main">
                D.M.I.T
            </div>

            <div class="logo-sub">
                SLAP WAR
            </div>

        </div>

        <div class="panel">

            <input
                id="playerName"
                type="text"
                maxlength="16"
                placeholder="ชื่อผู้เล่น"
            >

            <div class="two-buttons">

                <button
                    id="createRoomBtn"
                    class="primary"
                >
                    สร้างห้อง
                </button>

                <button
                    id="joinRoomBtn"
                >
                    เข้าห้อง
                </button>

            </div>

            <div class="room-row">

                <input
                    id="roomCode"
                    type="text"
                    maxlength="5"
                    placeholder="รหัสห้อง"
                >

                <button id="copyRoomBtn">
                    COPY
                </button>

            </div>

            <div
                id="connectionStatus"
                class="connection"
            >
                กำลังเชื่อมต่อ...
            </div>

        </div>

    </section>


    <!-- ================================= -->
    <!-- ROOM -->
    <!-- ================================= -->

    <section
        id="roomScreen"
        class="screen"
    >

        <div class="top-title">

            <div>
                D.M.I.T
                <span>SLAP WAR</span>
            </div>

            <button
                id="leaveRoomBtn"
                class="danger"
            >
                ออกจากห้อง
            </button>

        </div>

        <div class="room-panel">

            <div class="room-code-box">

                <div>
                    รหัสห้อง
                </div>

                <strong id="currentRoomCode">
                    -----
                </strong>

            </div>

            <h2>
                ผู้เล่น
            </h2>

            <div
                id="playerList"
                class="player-list"
            >
            </div>

            <div class="room-actions">

                <button
                    id="readyBtn"
                    class="primary"
                >
                    READY
                </button>

                <button
                    id="startGameBtn"
                    class="start"
                >
                    START GAME
                </button>

            </div>

            <div
                id="roomMessage"
                class="room-message"
            >
                รอผู้เล่น...
            </div>

        </div>

    </section>


    <!-- ================================= -->
    <!-- GAME -->
    <!-- ================================= -->

    <section
        id="gameScreen"
        class="screen game-screen"
    >

        <!-- TOP BAR -->

        <header class="game-header">

            <div class="game-logo">
                D.M.I.T
                <span>SLAP WAR</span>
            </div>

            <div class="game-info">

                <div>
                    ห้อง:
                    <strong id="gameRoomCode">
                        -----
                    </strong>
                </div>

                <div>
                    เวลา:
                    <strong id="turnTimer">
                        30
                    </strong>
                </div>

            </div>

        </header>


        <!-- GAME TABLE -->

        <main class="game-table">

            <!-- PLAYER 1 -->

            <div
                id="playerTop"
                class="player player-top"
            >

                <div class="avatar">
                    P1
                </div>

                <div class="player-info">

                    <strong class="player-name">
                        Player
                    </strong>

                    <span class="card-count">
                        13 ใบ
                    </span>

                </div>

                <div class="turn-dot">
                </div>

            </div>


            <!-- PLAYER 2 -->

            <div
                id="playerLeft"
                class="player player-left"
            >

                <div class="avatar">
                    P2
                </div>

                <div class="player-info">

                    <strong class="player-name">
                        Player
                    </strong>

                    <span class="card-count">
                        13 ใบ
                    </span>

                </div>

                <div class="turn-dot">
                </div>

            </div>


            <!-- PLAYER 3 -->

            <div
                id="playerRight"
                class="player player-right"
            >

                <div class="avatar">
                    P3
                </div>

                <div class="player-info">

                    <strong class="player-name">
                        Player
                    </strong>

                    <span class="card-count">
                        13 ใบ
                    </span>

                </div>

                <div class="turn-dot">
                </div>

            </div>


            <!-- CENTER -->

            <div class="arena">

                <div class="arena-title">
                    SLAP WAR
                </div>

                <div
                    id="pile"
                    class="pile"
                >
                </div>

                <div
                    id="pileInfo"
                    class="pile-info"
                >
                    เริ่มเกมด้วย 3♣
                </div>

                <div
                    id="gameMessage"
                    class="game-message"
                >
                </div>

            </div>

        </main>


        <!-- PLAYER HAND -->

        <section class="bottom-panel">

            <div
                id="myPlayerInfo"
                class="my-player-info"
            >

                <div class="my-avatar">
                    ME
                </div>

                <div>

                    <strong id="myName">
                        Player
                    </strong>

                    <span id="myCardCount">
                        13 ใบ
                    </span>

                </div>

            </div>


            <div
                id="hand"
                class="hand"
            >
            </div>


            <!-- ACTION BUTTONS -->

            <div class="action-bar">

                <button
                    id="passBtn"
                    class="action pass"
                >
                    PASS
                </button>

                <button
                    id="playBtn"
                    class="action play"
                >
                    PLAY
                </button>

                <button
                    id="slapBtn"
                    class="action slap"
                >
                    SLAP!
                </button>

            </div>


            <!-- EMOTES -->

            <div class="emotes">

                <button data-emoji="😂">
                    😂
                </button>

                <button data-emoji="😎">
                    😎
                </button>

                <button data-emoji="😭">
                    😭
                </button>

                <button data-emoji="😡">
                    😡
                </button>

                <button data-emoji="😱">
                    😱
                </button>

                <button data-emoji="🤡">
                    🤡
                </button>

                <button data-emoji="🔥">
                    🔥
                </button>

                <button data-emoji="💀">
                    💀
                </button>

                <button data-emoji="👏">
                    👏
                </button>

            </div>

        </section>

    </section>


    <!-- ================================= -->
    <!-- RESULT -->
    <!-- ================================= -->

    <div
        id="resultModal"
        class="modal"
    >

        <div class="result-box">

            <div class="result-small">
                GAME OVER
            </div>

            <div
                id="winnerText"
                class="winner-text"
            >
                WINNER
            </div>

            <button
                id="backRoomBtn"
                class="primary"
            >
                กลับห้อง
            </button>

        </div>

    </div>


    <!-- TOAST -->

    <div id="toast">
    </div>


    <!-- SOCKET.IO -->

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <!-- CONFIG -->

    <script src="config.js"></script>

    <!-- GAME -->

    <script src="app.js"></script>

</body>

</html>
